[default]
host = victim-ubuntu

# --- Web ---
[monitor:///opt/victim-lab/logs/nginx/access.log]
index = web
sourcetype = nginx:access:json

[monitor:///opt/victim-lab/logs/nginx/error.log]
index = web
sourcetype = nginx:error

# --- WAF ---
[monitor:///opt/victim-lab/logs/modsecurity/audit.log]
index = waf
sourcetype = modsecurity:audit:json

# --- OS ---
[monitor:///var/log/auth.log]
index = os
sourcetype = linux_secure

[monitor:///var/log/syslog]
index = os
sourcetype = syslog

# --- Docker (json-file driver; UF must run as root or have read access) ---
[monitor:///var/lib/docker/containers/*/*-json.log]
index = docker
sourcetype = docker:json
